name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    name: runtime (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,rich]"
      - run: python -m pytest --cov=scriptkit.entrypoint --cov-report=term-missing --cov-fail-under=90
      - run: python -m mypy
      # build makes the wheel from the sdist, testing both artifact paths.
      - run: python -m build
      - run: python tools/check_artifact.py dist/pokanop_scriptkit-1.3.0-py3-none-any.whl
      - run: python tools/check_artifact.py dist/pokanop_scriptkit-1.3.0-py3-none-any.whl --rich
