name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  attestations: read

jobs:
  runtime:
    name: runtime (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,rich]'
      - run: python -m pytest --cov --cov-report=xml --junitxml=results.xml
      - run: python tools/verify_results.py results.xml
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_artifact.py dist/pokanop_scriptkit-1.5.0-py3-none-any.whl
      - run: python tools/check_artifact.py dist/pokanop_scriptkit-1.5.0-py3-none-any.whl --rich
      - name: Installed Rich lower-bound compatibility
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python tools/check_artifact.py dist/pokanop_scriptkit-1.5.0-py3-none-any.whl --rich --rich-version 13.9.4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            results.xml
          if-no-files-found: error

  static:
    name: static-and-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev,rich]'
      - name: Resolve every action pin as a commit (including release-only actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_action_pins.py
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python -m mypy
      - run: python -m pytest tools/tests
      - run: python tools/rename_inventory.py --check
      - run: python -m pytest --cov --cov-report=xml
      - name: Changed framework lines must have 90% coverage
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          # Dispatch/tag rehearsal checks the previous commit, never an empty self-diff.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}"; then BASE=HEAD^; fi
          diff-cover coverage.xml --compare-branch "$BASE" --include 'src/scriptkit/*' --fail-under 90
      - name: Verify failure propagation (intentional failing test and type error)
        run: python tools/check_failure_gates.py

  security:
    name: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev,rich]'
      - run: python -m pip install 'pip==26.2' 'setuptools==83.0.0' 'wheel==0.46.3'
      - run: python -m pip_audit --skip-editable

  release:
    name: release-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev,rich]'
      - run: python tools/rehearse_release.py
      - run: cd dist && sha256sum --check SHA256SUMS
      - run: python tools/check_artifact.py dist/pokanop_scriptkit-1.5.0-py3-none-any.whl
      - run: python tools/check_artifact.py dist/pokanop_scriptkit-1.5.0-py3-none-any.whl --rich
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  certification:
    name: certification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/certify_release.py --output certification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: certification-${{ matrix.os }}
          path: certification/*
          if-no-files-found: error

  required:
    name: required-quality
    if: always()
    needs: [runtime, static, security, release, certification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed on failure, cancellation, or skipped prerequisite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert len(results)==5 and all(j["result"]=="success" for j in results.values()), results'
