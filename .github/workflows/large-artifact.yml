name: Large artifact (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  torch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Exact Torch wheel, full manager path and peak RSS
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o memory.txt python tools/large_artifact_probe.py evidence --torch 2>&1 | tee output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: torch-evidence
          path: |
            memory.txt
            output.txt
            evidence/locked-catalog.json
