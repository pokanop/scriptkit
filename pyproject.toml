[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pokanop-scriptkit"
version = "1.3.0"
description = "Dependency-light building blocks for cohesive Python command-line tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Pokanop Apps LLC"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
rich = ["rich>=13.9.4,<14"]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "mypy>=1.11"]

[project.scripts]
scriptkit = "scriptkit.entrypoint:main"

[project.urls]
Repository = "https://github.com/pokanop/scriptkit"
Issues = "https://github.com/pokanop/scriptkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
files = ["src/scriptkit/entrypoint.py"]
follow_imports = "silent"
strict = true
