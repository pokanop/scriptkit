[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pokanop-scriptkit"
version = "1.4.0"
description = "Dependency-light building blocks for cohesive Python command-line tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Pokanop Apps LLC"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
ai-keyring = ["keyring>=25.7,<26"]
rich = ["rich>=13.9.4,<15"]
dev = ["build==1.6.1", "pytest==9.1.1", "pytest-cov==7.1.0", "mypy==2.4.0", "ruff==0.16.10", "diff-cover==10.6.0", "twine==6.2.0", "pip-audit==2.10.1", "jsonschema==4.26.0"]

[project.scripts]
scriptkit = "scriptkit.entrypoint:main"

[project.urls]
Repository = "https://github.com/pokanop/scriptkit"
Issues = "https://github.com/pokanop/scriptkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scriptkit.contracts.resources" = ["*.json"]
"scriptkit.generator.resources" = ["*.json"]
"scriptkit.conformance.resources" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/scriptkit"]
strict = true

# Imported 1.3.0 runtime: debt is explicit, not a wildcard covering future modules.
[[tool.mypy.overrides]]
module = ["scriptkit.app", "scriptkit.blocks", "scriptkit.cli", "scriptkit.config", "scriptkit.console", "scriptkit.doctor", "scriptkit.proc", "scriptkit.progress", "scriptkit.style", "scriptkit.tables", "scriptkit.text", "scriptkit"]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Preserve the imported runtime byte-for-byte; new modules are checked by default.
exclude = ["src/scriptkit/app.py", "src/scriptkit/blocks.py", "src/scriptkit/cli.py", "src/scriptkit/config.py", "src/scriptkit/console.py", "src/scriptkit/doctor.py", "src/scriptkit/proc.py", "src/scriptkit/progress.py", "src/scriptkit/style.py", "src/scriptkit/tables.py", "src/scriptkit/text.py", "src/scriptkit/__init__.py"]

[tool.coverage.run]
source = ["scriptkit"]
branch = true

[tool.coverage.report]
show_missing = true
